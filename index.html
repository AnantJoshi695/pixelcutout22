<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelCutout - AI Background Remover</title>
    <meta name="description" content="Remove image backgrounds with AI and precise manual control. Professional image editing made simple." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      /*
       * Apply the saved theme before React mounts so the first paint already
       * matches the user's choice (no flash of the wrong theme).
       */
      (function () {
        try {
          var stored = localStorage.getItem('theme') || 'system';
          var isDark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(isDark ? 'dark' : 'light');
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage unavailable — fall through to the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
